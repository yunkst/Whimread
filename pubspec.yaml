name: novel_app
description: "Whimread — AI 原生小说阅读平台前端（书架 / 阅读 / Agent Chat / 角色 / 关系图 / OCR 反爬）"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 3.0.0-preview.11+130

repository: https://github.com/yunkst/Whimread
homepage: https://github.com/yunkst/Whimread

environment:
  sdk: ">=3.1.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # HTTP请求
  http: ^1.1.0
  dio: ^5.4.0
  built_value: ^8.9.0
  built_collection: ^5.1.1

  # HTML解析
  html: ^0.15.4

  # Markdown渲染
  flutter_markdown: ^0.6.14

  # JSON序列化
  json_annotation: ^4.8.0

  # 本地数据库
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3

  # FFI 工具（sd.cpp 绑定层用 Utf8.toUtf8 / calloc；sqflite_common_ffi 已传递依赖但显式声明便于阅读）
  ffi: ^2.1.0

  # 注解（visibleForTesting 等）；conversion 模块刻意不依赖 flutter 以便宿主机 dart run 复用
  meta: ^1.10.0

  # 状态管理 (已弃用，改用 Riverpod)
  # provider: ^6.1.1
  equatable: ^2.0.5

  # Riverpod 状态管理
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # 视频播放
  video_player: ^2.8.0

  # 可见性检测
  visibility_detector: ^0.4.0+2

  # Agent 图片画廊全屏查看（双指缩放 + PageView）
  photo_view: ^0.15.0

  # 图片裁剪
  image_cropper: ^8.0.2

  # 图片选择（相册）
  image_picker: ^1.1.2

  # 依赖注入 (未使用，已注释)
  # get_it: ^7.6.4

  # 共享偏好设置
  shared_preferences: ^2.2.2

  # 安全存储（Android Keystore/EncryptedSharedPreferences）：设备 JWT 等凭证
  flutter_secure_storage: ^9.2.4

  # ZIP 打包/解包（用于备份包：DB + SharedPreferences 一起打包）
  archive: ^3.6.1

  # Toast消息提示
  fluttertoast: ^8.2.4

  # APP更新功能（自 v1.10 起 webview 不再下载模型，background_downloader 仅供
  # AppUpdateService 通过 Dio.download 通道使用，如未来彻底切换可继续瘦身）
  permission_handler: ^11.0.0
  package_info_plus: ^8.0.0
  # 打开外部链接（崩溃弹框引导跳 GitHub issue 页）
  url_launcher: ^6.2.0
  # 设备信息（用于按 CPU 架构选择 APK）
  device_info_plus: ^11.0.0

  # OpenAPI生成的代码包
  novel_api:
    path: generated/api
  crypto: ^3.0.7

  # 图可视化(统一使用 flutter_force_directed_graph)
  flutter_force_directed_graph: ^1.0.8

  # WebView 浏览器
  flutter_inappwebview: ^6.0.0

  riverpod: any

  # DSL 引擎依赖
  yaml: ^3.1.2
  jinja: ^0.6.6

  # OCR PoC：PP-OCRv6 离线识别（仅 main_ppocr_demo.dart 使用）
  # 2026-07-28 升级 ^1.6.0 → ^1.8.3：底层 ORT 1.22.0 → 1.23.0，排查 vivo Android 16
  # 真机 SIGABRT（libonnxruntime.so 内 ORT native abort）。changelog 无针对该 bug
  # 的直接修复，升级属版本试探，非定向补丁。
  flutter_onnxruntime: ^1.8.3
  image: ^4.3.0
  file_picker: ^11.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Official Dart lint rules (core + recommended sets).
  # Activated in `analysis_options.yaml` via include: package:lints/recommended.yaml
  # Provides stricter unused-code detection than flutter_lints.
  lints: ^6.0.0

  # Timer 推进（DeviceQuotaNotifier 防抖单测）
  fake_async: ^1.3.1

  # 测试数据库
  sqflite_common_ffi: ^2.3.0

  # JSON序列化代码生成
  build_runner: ^2.4.7
  json_serializable: ^6.7.0
  built_value_generator: ^8.9.0

  # Riverpod 代码生成
  riverpod_generator: ^2.3.9
  riverpod_lint: ^2.3.7

  # 测试依赖
  mockito: ^5.4.0
  coverage: ^1.6.0
  integration_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # ─── 阅读风内嵌字体（Noto Serif/Sans SC，已子集化）───
  # 子集覆盖 CJK 基本区 + 全角标点 + 拉丁，生僻字由 fontFamilyFallback 兜底。
  fonts:
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Regular.ttf
        - asset: assets/fonts/NotoSerifSC-Bold.ttf
          weight: 700
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700

  # 注:PP-OCRv6 模型 (inference.onnx 21MB + ppocrv6_dict.txt 75KB) 已迁移到
  # CloudBase Storage,启动后由 OcrModelDownloader 后台下载到 app 私有目录。
  # 详见 lib/services/ocr_model_downloader.dart。模型不再随 APK 打包,APK arm64
  # 从 97MB 缩到约 76MB(节省 22%)。tool/ocr_test_assets/ 下的测试图
  # (chapter_full.png 等) 被 .gitignore 排除,不入库,本机 PoC 时本地提供即可。

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
