name: novel_app
description: "Whimread — AI 原生小说阅读平台前端（书架 / 阅读 / Agent Chat / 角色 / 关系图 / OCR 反爬）"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 3.2.1-preview.1+164

repository: https://github.com/yunkst/Whimread
homepage: https://github.com/yunkst/Whimread

environment:
  sdk: ">=3.1.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # HTTP请求
  http: ^1.1.0
  dio: ^5.4.0

  # Markdown渲染
  flutter_markdown: ^0.6.14

  # JSON序列化
  json_annotation: ^4.8.0

  # 本地数据库
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3

  # 注解（visibleForTesting 等）
  meta: ^1.10.0

  # Riverpod 状态管理
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Agent 图片画廊全屏查看（双指缩放 + PageView）
  photo_view: ^0.15.0

  # 图片裁剪
  image_cropper: ^8.0.2

  # 图片选择（相册）
  image_picker: ^1.1.2

  # 共享偏好设置
  shared_preferences: ^2.2.2

  # 安全存储（Android Keystore/EncryptedSharedPreferences）：设备 JWT 等凭证
  flutter_secure_storage: ^9.2.4

  # ZIP 打包/解包（用于备份包：DB + SharedPreferences 一起打包）
  archive: ^3.6.1

  # Toast消息提示
  fluttertoast: ^8.2.4

  # APP更新功能（自 v1.10 起 webview 不再下载模型，background_downloader 仅供
  # AppUpdateService 通过 Dio.download 通道使用，如未来彻底切换可继续瘦身）
  permission_handler: ^11.0.0
  package_info_plus: ^8.0.0
  # 打开外部链接（崩溃弹框引导跳 GitHub issue 页）
  url_launcher: ^6.2.0
  # 设备信息（用于按 CPU 架构选择 APK）
  device_info_plus: ^11.0.0

  crypto: ^3.0.7

  # 图可视化(统一使用 flutter_force_directed_graph)
  flutter_force_directed_graph: ^1.0.8

  # WebView 浏览器
  flutter_inappwebview: ^6.0.0

  riverpod: any

  # OCR：PP-OCRv6 离线识别（lib/services/ocr/ocr_predictor.dart，生产 OCR 还原）
  # 2026-07-28 升级 ^1.6.0 → ^1.8.3：底层 ORT 1.22.0 → 1.23.0，排查 vivo Android 16
  # 真机 SIGABRT（libonnxruntime.so 内 ORT native abort）。changelog 无针对该 bug
  # 的直接修复，升级属版本试探，非定向补丁。
  flutter_onnxruntime: ^1.8.3
  image: ^4.3.0
  file_picker: ^11.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Official Dart lint rules (core + recommended sets).
  # Activated in `analysis_options.yaml` via include: package:lints/recommended.yaml
  # Provides stricter unused-code detection than flutter_lints.
  lints: ^6.0.0

  # Timer 推进（DeviceQuotaNotifier 防抖单测）
  fake_async: ^1.3.1

  # 测试数据库
  sqflite_common_ffi: ^2.3.0
  # 测试直接引用的底层接口（内存库构造 / 平台路径注入；此前是传递依赖，
  # 测试代码 import 后 analyzer 报 depend_on_referenced_packages）
  sqflite_common: ^2.5.6
  path_provider_platform_interface: ^2.1.2

  # 代码生成（build_runner 同时驱动 riverpod_generator / mockito / json_serializable）
  build_runner: ^2.4.7
  json_serializable: ^6.7.0

  # Riverpod 代码生成
  riverpod_generator: ^2.3.9

  # 测试依赖
  mockito: ^5.4.0
  coverage: ^1.6.0
  integration_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # ─── 阅读风内嵌字体（Noto Serif/Sans SC，已子集化）───
  # 2026-09 APK 瘦身：四个 ttf（~38MB）改为启动资源引导动态下载 +
  # FontLoader 运行时注册（lib/services/app_resource_manager.dart），
  # 不再随 APK 打包。assets/fonts/ 下的源文件保留，供
  # tool/publish_resources.dart 生成 manifest 上传到资源 bucket。

  # 注:PP-OCRv6 模型 (inference.onnx 21MB + ppocrv6_dict.txt 75KB) 已迁移到
  # CloudBase Storage,启动后由 OcrModelDownloader 后台下载到 app 私有目录。
  # 详见 lib/services/ocr_model_downloader.dart。

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # Local Dream 嵌入式引擎（方案 A）：模型目录内置在 Dart 代码中
  # （lib/services/local_dream_embedded/model_pack.dart，逐条移植自
  # Local Dream ModelRepository.kt）；qnnlibs/ 为 QNN 运行库占位
  # （Local Dream build.sh 产物，首启解压到应用私有目录）。

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
