version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
    commit:
      message: "chore(ci): update GitHub Actions versions"
    labels:
      - "dependencies"
      - "ci"


  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    commit:
      message: "chore(flutter): update Flutter dependencies"
    labels:
      - "dependencies"
      - "flutter"
