name: Flutter Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag（如 v1.7.21），需已存在'
        required: true
        type: string

permissions:
  contents: write

# 避免同 tag 并发发布互相覆盖
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 质量门禁：先跑 analyze + test，通过后才允许 build APK。
  # 历史上 release 直接 build，任何 analyze/test 报错都会被掩盖到二进制里，
  # 现在让 quality 必过才能 build。
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          # 锁定与本地预检一致的版本。不能用 '3.x'：会跟随最新 stable
          # （曾漂移到 3.47.1/Dart 3.13），其自带的 analyzer 3.9 无法解析
          # Dart 3.10+ DotShorthandPropertyAccess AST，riverpod_generator
          # 在 CI 上直接崩溃（Missing implementation of visitDotShorthand...），
          # 表现为 Generate code 步骤静默挂死至 job 超时。
          flutter-version: '3.35.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        # 必须用 '*_test.dart' 过滤：flutter test 只在传目录时才自动挑
        # _test.dart；一旦显式列文件（本写法），所有传入路径都会被当
        # 测试加载，*.mocks.dart 等非测试文件会因无 main() 编译失败
        # （曾在 CI 上致 16 个 loading failed 假失败）。
        # SKIP_LIST 的 subagent_detail_screen_test.dart 引用已删 API，
        # 文件级编译失败，grep 跳过待修复。
        run: |
          rm -rf .dart_tool/sqflite_common_ffi 2>/dev/null || true
          SKIP_LIST="test/screens/subagent_detail_screen_test.dart"
          FILES=""
          for d in test/unit/ test/bug/ test/verification/; do
            for f in $(find "$d" -name '*_test.dart' 2>/dev/null); do
              skip=0
              for s in $SKIP_LIST; do
                [ "$f" = "$s" ] && skip=1 && break
              done
              [ $skip -eq 0 ] && FILES="$FILES $f"
            done
          done
          flutter test --no-pub $FILES

  build-and-release:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 生成 changelog 需要完整历史

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          echo "name=${TAG}" >> $GITHUB_OUTPUT
          # 不带 v 前缀的纯版本号
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Extract version code from pubspec
        id: version
        run: |
          # pubspec.yaml: version: 1.7.20+69
          # NOTE: 默认 working-directory = 仓库根
          VERSION_CODE=$(grep -E "^version:" pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          if [ -z "$VERSION_CODE" ]; then
            echo "❌ 无法从 pubspec.yaml 解析 version code"
            exit 1
          fi
          echo "code=${VERSION_CODE}" >> $GITHUB_OUTPUT

      - name: Detect prerelease
        id: prerelease
        run: |
          # 所有含 '-' 的 tag（如 v2.0.0-preview.1）标记为 prerelease，
          # 纯语义化版本 tag（如 v2.0.0）标记为稳定版。
          if [[ "${{ steps.tag.outputs.name }}" == *-* ]]; then
            echo "flag=true" >> $GITHUB_OUTPUT
          else
            echo "flag=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog from tag message
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 从 tag 的 annotation message 提取 changelog
          # GitHub Actions checkout 会将 annotated tag 退化为 lightweight tag，
          # 导致 %(body)/%(contents)/cat-file 等本地 git 命令均无法获取 message。
          # 改用 GitHub API 直接读取 tag object，最可靠。
          TAG_NAME="${{ steps.tag.outputs.name }}"
          REPO="${{ github.repository }}"

          # 通过 GitHub API 获取 tag object 的 message
          TAG_DATA=$(gh api "repos/$REPO/git/refs/tags/$TAG_NAME" --jq '.object.sha' 2>/dev/null)
          if [ -z "$TAG_DATA" ]; then
            echo "  ⚠️  无法通过 API 获取 tag ref: $TAG_NAME"
            CHANGELOG="Bug 修复和性能优化"
          else
            TAG_TYPE=$(gh api "repos/$REPO/git/tags/$TAG_DATA" --jq '.message // empty' 2>/dev/null)
            if [ -z "$TAG_TYPE" ]; then
              # ref 指向的可能不是 tag object 而是 commit (lightweight)
              # 尝试直接从 ref 的 object 获取
              OBJECT_URL=$(gh api "repos/$REPO/git/refs/tags/$TAG_NAME" --jq '.object.url' 2>/dev/null)
              TAG_MSG=$(gh api "$OBJECT_URL" --jq '.message // .tag.message // empty' 2>/dev/null)
              if [ -z "$TAG_MSG" ]; then
                CHANGELOG="Bug 修复和性能优化"
              else
                # 跳过第一行 "Release X.Y.Z" 和空行
                CHANGELOG=$(echo "$TAG_MSG" | tail -n +3)
                if [ -z "$(echo "$CHANGELOG" | tr -d '[:space:]')" ]; then
                  CHANGELOG="Bug 修复和性能优化"
                fi
              fi
            else
              # tag object 有 message 字段
              CHANGELOG=$(echo "$TAG_TYPE" | tail -n +3)
              if [ -z "$(echo "$CHANGELOG" | tr -d '[:space:]')" ]; then
                CHANGELOG="Bug 修复和性能优化"
              fi
            fi
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          echo "===== 提取到的 changelog ====="
          echo "$CHANGELOG"
          echo "=============================="

      - name: Render release body
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          # 用实际版本号替换 {{VERSION}}，用 changelog 替换 {{CHANGELOG}}
          # 用 Python 避免 sed 的特殊字符（/、&、\、换行）转义问题
          # NOTE: working-directory = 仓库根，.github 即仓库根
          python3 -c '
          import os
          with open(".github/release_template.md", "r", encoding="utf-8") as f:
              body = f.read()
          body = body.replace("{{VERSION}}", "v" + os.environ["VERSION"])
          body = body.replace("{{CHANGELOG}}", os.environ["CHANGELOG"])
          with open("release_body.md", "w", encoding="utf-8") as f:
              f.write(body)
          '
          echo "===== 渲染后的 release_body.md ====="
          cat release_body.md

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          # 锁定与本地预检一致的版本。不能用 '3.x'：会跟随最新 stable
          # （曾漂移到 3.47.1/Dart 3.13），其自带的 analyzer 3.9 无法解析
          # Dart 3.10+ DotShorthandPropertyAccess AST，riverpod_generator
          # 在 CI 上直接崩溃（Missing implementation of visitDotShorthand...），
          # 表现为 Generate code 步骤静默挂死至 job 超时。
          flutter-version: '3.35.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "❌ 缺少 secret ANDROID_KEYSTORE_BASE64，请在仓库 Settings → Secrets 配置"
            exit 1
          fi
          # keystore 放在 android 根目录（rootProject），key.properties 中的 storeFile 用 rootProject.file 解析
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/novel-app-release-key.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=novel-app-release-key.jks
          EOF
          echo "✅ keystore 解码完成，key.properties 已生成"
          ls -la android/novel-app-release-key.jks

      - name: Build per-architecture release APKs
        run: flutter build apk --release --split-per-abi

      - name: Compute SHA256 checksums
        working-directory: ./build/app/outputs/flutter-apk
        run: |
          sha256sum app-*-release.apk > SHA256SUMS.txt
          echo "===== SHA256SUMS.txt ====="
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body_path: release_body.md
          # draft 永远 false：preview 版也直接发布（仅靠 prerelease 标记区分通道），
          # 否则 /releases?per_page=1 拿不到 draft 版本，预览通道失效。
          draft: false
          prerelease: ${{ steps.prerelease.outputs.flag == 'true' }}
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt

      - name: Publish release to backend
        # GitHub Release 之后把 APK 同步推送到 CloudBase 后端 + 写 app_releases 表。
        # 流程(零腾讯云密钥):
        #   1. POST /api/admin/app/releases/init 拿每个 APK 的 COS 预签名 PUT URL
        #      (云函数用 SCF 运行时凭据本地算 HMAC-SHA1,不联网)
        #   2. curl PUT 每个 APK 到预签名 URL(走 COS,不受 6MB 网关限制)
        #   3. POST /api/admin/app/releases/publish JSON 写 PG(文件已在 Storage)
        continue-on-error: true
        env:
          BACKEND_URL: ${{ secrets.WHIMREAD_BACKEND_URL }}
          BACKEND_TOKEN: ${{ secrets.WHIMREAD_BACKEND_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          CHANNEL: ${{ steps.prerelease.outputs.flag == 'true' && 'preview' || 'stable' }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          set -e
          if [ -z "$BACKEND_URL" ] || [ -z "$BACKEND_TOKEN" ]; then
            echo "⚠️ 未配置 WHIMREAD_BACKEND_URL / WHIMREAD_BACKEND_TOKEN,跳过后端发布"
            exit 0
          fi

          APK_DIR=build/app/outputs/flutter-apk

          # 1. 算每个 APK 的 SHA256
          abi_map=(
              "app-arm64-v8a-release.apk|arm64-v8a"
              "app-armeabi-v7a-release.apk|armeabi-v7a"
              "app-x86_64-release.apk|x86_64"
          )
          declare -a apk_files=()
          declare -a apk_abi=()
          declare -a apk_sha=()
          for entry in "${abi_map[@]}"; do
              apk="${entry%%|*}"
              abi="${entry##*|}"
              path="$APK_DIR/$apk"
              if [ ! -f "$path" ]; then continue; fi
              sha=$(sha256sum "$path" | awk '{print $1}')
              apk_files+=("$path")
              apk_abi+=("$abi")
              apk_sha+=("$sha")
          done
          if [ ${#apk_files[@]} -eq 0 ]; then
            echo "❌ 未找到任何 APK 产物"; exit 1
          fi

          # 2. 构造 init 请求体
          init_files_json=""
          for i in "${!apk_files[@]}"; do
              apk=$(basename "${apk_files[$i]}")
              [ -n "$init_files_json" ] && init_files_json+=",
              init_files_json+="{\"abi\":\"${apk_abi[$i]}\",\"filename\":\"$apk\",\"size\":$(stat -c%s "${apk_files[$i]}"),\"sha256\":\"${apk_sha[$i]}\"}"
          done
          init_body="{\"version\":\"$VERSION\",\"channel\":\"$CHANNEL\",\"files\":[$init_files_json]}"

          echo "==> 步骤 1: POST /init 拿 COS 预签名上传 URL"
          init_resp=$(curl --fail-with-body -sS -X POST "$BACKEND_URL/api/admin/app/releases/init" \
            -H "X-API-TOKEN: $BACKEND_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$init_body")
          echo "$init_resp" | head -c 400; echo "..."
          echo "$init_resp" > /tmp/init_resp.json

          # 3. 解析每个 uploadUrl 并 PUT APK
          echo "==> 步骤 2: 用预签名 URL PUT 每个 APK 到 CloudBase Storage"
          python3 - <<'PYEOF'
          import json, subprocess, sys, os
          init = json.load(open("/tmp/init_resp.json"))
          apk_dir = os.environ.get("APK_DIR", "build/app/outputs/flutter-apk")
          for item in init["uploadUrls"]:
              apk_path = os.path.join(apk_dir, item["filename"])
              print(f"PUT {item['filename']} → {item['uploadUrl'][:120]}...")
              rc = subprocess.run([
                  "curl", "--fail-with-body", "-sS",
                  "-X", "PUT", item["uploadUrl"],
                  "-H", "Content-Type: application/vnd.android.package-archive",
                  "--data-binary", f"@{apk_path}",
              ], check=False).returncode
              if rc != 0:
                  print(f"❌ {item['filename']} 上传失败 (curl exit {rc})")
                  sys.exit(1)
          print("✅ 3 个 APK 全部上传到 CloudBase Storage")
          PYEOF

          # 4. POST /publish JSON 写 PG
          echo "==> 步骤 3: POST /publish JSON 写 PG"
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error
          init = json.load(open("/tmp/init_resp.json"))
          apk_dir = os.environ.get("APK_DIR", "build/app/outputs/flutter-apk")
          files = []
          for item in init["uploadUrls"]:
              apk_path = os.path.join(apk_dir, item["filename"])
              files.append({
                  "abi": item["abi"],
                  "filename": item["filename"],
                  "size": os.path.getsize(apk_path),
                  "sha256": __import__("hashlib").sha256(open(apk_path, "rb").read()).hexdigest(),
                  "storageKey": item["storageKey"],
                  "storageUrl": item["publicUrl"],
              })
          payload = {
              "version": os.environ["VERSION"],
              "versionCode": int(os.environ.get("VERSION_CODE") or 0),
              "channel": os.environ["CHANNEL"],
              "changelog": os.environ.get("CHANGELOG") or "",
              "files": files,
          }
          req = urllib.request.Request(
              f"{os.environ['BACKEND_URL']}/api/admin/app/releases/publish",
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              method="POST",
              headers={
                  "Content-Type": "application/json; charset=utf-8",
                  "X-API-TOKEN": os.environ["BACKEND_TOKEN"],
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  print(f"✅ publish 成功 (HTTP {resp.status}): {resp.read().decode('utf-8')[:300]}")
          except urllib.error.HTTPError as e:
              print(f"❌ publish 失败 (HTTP {e.code}): {e.read().decode('utf-8')[:300]}")
              sys.exit(1)
          PYEOF
