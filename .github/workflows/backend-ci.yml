name: Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        # tests/ 的存量 lint（ARG005 等 60+ 项）未清，先保持 app 范围；
        # 新增测试文件已按 tests 规则自查
        run: ruff check app

      - name: Ruff format check
        run: ruff format --check app

      - name: Mypy
        # mypy strict 模式对未注解的第三方 stub 会大量告警，
        # --ignore-missing-imports 仅抑制缺失 stub，不抑制真类型错误。
        run: mypy app --ignore-missing-imports

      - name: Pytest
        # 2026-09-06 起测试套件 179+ 用例全绿，门禁正式生效（移除 continue-on-error）。
        run: pytest -q
